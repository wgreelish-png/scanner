name: iOS workflow checks
on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:
    inputs:
      job_scope:
        description: Jobs to run
        type: choice
        default: all
        options:
          - all
          - native
          - ui
          - research_ui
          - evidence_ui
          - budget_ui
          - release
      test_scope:
        description: Regression scope
        type: choice
        default: all
        options:
          - all
          - printer_transport
          - label_controls
          - label_preview
          - label_queue
          - show_readiness
          - navigation_price
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.job_scope || 'all' }}-${{ inputs.test_scope || 'all' }}
  # Let an active validation finish when another run is requested on this branch.
  cancel-in-progress: false
jobs:
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job_scope == 'all' || inputs.job_scope == 'native' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules --test Tests/JavaScript/*.cjs
      - run: node --test server/research/tests/*.test.mjs
      - run: node --test postman/test_*.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_xcode_sources.py
      - run: python3 scripts/check_scanner_runtime.py
      - name: Build and run native regression tests
        id: native_tests
        env:
          SCANNER_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: |
          if [ "$SCANNER_TEST_SCOPE" = printer_transport ] || [ "$SCANNER_TEST_SCOPE" = label_controls ]; then
            bash scripts/run_ios_tests.sh CardShowScannerTests/NiimbotProtocolTests CardShowScannerTests/ScannerDiagnosticsTests CardShowScannerTests/LabelPrintQueueTests CardShowScannerTests/NiimbotImageTransferPreferencesTests CardShowScannerTests/NiimbotRollReadCoordinatorTests CardShowScannerTests/NiimbotLabelCatalogTests CardShowScannerTests/NiimbotLabelProductResolverTests
          elif [ "$SCANNER_TEST_SCOPE" = label_preview ]; then
            bash scripts/run_ios_tests.sh CardShowScannerTests/InventoryLabelTests CardShowScannerTests/AdaptiveLabelRenderingTests CardShowScannerTests/CustomPriceTagTests CardShowScannerTests/CustomLabelQueueTests CardShowScannerTests/LabelPrintQueueTests CardShowScannerTests/NiimbotImageTransferPreferencesTests CardShowScannerTests/NiimbotRollReadCoordinatorTests CardShowScannerTests/NiimbotLabelCatalogTests CardShowScannerTests/ScannerDiagnosticsTests CardShowScannerTests/NiimbotLabelProductResolverTests CardShowScannerTests/ShowInventorySortTests CardShowScannerTests/InventoryLabelBatchTests
          elif [ "$SCANNER_TEST_SCOPE" = label_queue ]; then
            bash scripts/run_ios_tests.sh CardShowScannerTests/LabelPrintQueueTests CardShowScannerTests/LabelPrintRunOutcomeTests CardShowScannerTests/CustomPriceTagTests
          elif [ "$SCANNER_TEST_SCOPE" = show_readiness ]; then
            bash scripts/run_ios_tests.sh \
              CardShowScannerTests/ShowBudgetTests \
              CardShowScannerTests/ShowBudgetStoreTests \
              CardShowScannerTests/ShowCostLedgerTests \
              CardShowScannerTests/OwnedListInventoryTests \
              CardShowScannerTests/ShowInventoryReconciliationTests \
              CardShowScannerTests/ShowTransactionListServiceTests \
              CardShowScannerTests/LabelPrintQueueTests \
              CardShowScannerTests/LabelPrintProgressSessionTests \
              CardShowScannerTests/LabelPrintRunOutcomeTests \
              CardShowScannerTests/ScannerDiagnosticsTests \
              CardShowScannerTests/ScannerPageRecoveryTests \
              CardShowScannerTests/DeviceHealthMonitorTests \
              CardShowScannerTests/DeviceHealthValuesTests
          else
            bash scripts/run_ios_tests.sh CardShowScannerTests
          fi
      - name: Publish native test summary
        if: ${{ always() && steps.native_tests.outcome != 'skipped' }}
        run: python3 scripts/report_xcode_test_summary.py NativeTests.log
      - name: Report native test failures
        if: ${{ always() && steps.native_tests.outcome != 'success' && steps.native_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Native tests failed; see the native-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeCrashSummary.log
  ui:
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.job_scope == 'all' || inputs.job_scope == 'ui') && inputs.test_scope != 'printer_transport' && inputs.test_scope != 'navigation_price') }}
    runs-on: macos-15-intel
    # The full selection can use 39 bounded six-minute cases, plus cold setup.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Validate UI runner timing and concurrency contracts
        run: python3 -m unittest discover -s scripts -p 'test_ui_runner_flow.py'
      - name: Build and run UI regression tests
        id: ui_tests
        env:
          SCANNER_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: |
          if [ "$SCANNER_TEST_SCOPE" = label_preview ]; then
            bash scripts/run_ios_tests.sh \
              CardShowScannerUITests/InventoryLabelsUITests/testSelectedInventoryIsReadyImmediatelyOnFirstNavigation \
              CardShowScannerUITests/InventoryLabelsUITests/testReselectedInventoryIsReadyImmediatelyWithoutLayoutChanges \
              CardShowScannerUITests/InventoryLabelsUITests/testPrintAllIsReadyImmediatelyWithoutLayoutChanges \
              CardShowScannerUITests/InventoryLabelsUITests/testInventoryPrintOrderSortsNumericPricesAndRemembersSelection \
              CardShowScannerUITests/InventoryLabelsUITests/testGameFilterCarriesFromInventoryIntoPrintedLabelBatch
          elif [ "$SCANNER_TEST_SCOPE" = label_queue ]; then
            bash scripts/run_ios_tests.sh \
              CardShowScannerUITests/InventoryLabelsUITests/testLeavingUnprintedInventoryQueueClearsItAndAllowsPreparingAgain \
              CardShowScannerUITests/InventoryLabelsUITests/testQueuedPreviewRetainsUnprintedLabelsUntilQueueIsLeft \
              CardShowScannerUITests/InventoryLabelsUITests/testLeavingCustomAndBulkPrintQueuesClearsThemAndPreservesPreferences \
              CardShowScannerUITests/InventoryLabelsUITests/testPrintingFailureStaysAvailableForReviewWithoutAutomaticRetryOrNavigation
          elif [ "$SCANNER_TEST_SCOPE" = show_readiness ]; then
            bash scripts/run_ios_tests.sh \
              CardShowScannerUITests/ReviewPresentationUITests/testListLookupStaysVisibleAfterScrollingAndPreservesCardsAndOfferDraft \
              CardShowScannerUITests/ShowTransactionsUITests/testOwnedScannedListEntersInventoryOnceWithoutChangingShowCash \
              CardShowScannerUITests/InventoryLabelsUITests/testCustomPrintingShowsProgressWaitsForFinalAcknowledgementAndReturnsToPriceTags
          elif [ "$SCANNER_TEST_SCOPE" = label_controls ]; then
            bash scripts/run_ios_tests.sh \
              CardShowScannerUITests/InventoryLabelsUITests/testPaperModeCanBeChosenOfflineAndPersistsAfterUnprintedQueueCleanup \
              CardShowScannerUITests/InventoryLabelsUITests/testPauseDuringUploadKeepsEveryUnconfirmedCopyAvailableForReview \
              CardShowScannerUITests/InventoryLabelsUITests/testPauseKeepsProgressForQueueReviewInsteadOfReturningToPriceTags \
              CardShowScannerUITests/InventoryLabelsUITests/testPrintingFailureStaysAvailableForReviewWithoutAutomaticRetryOrNavigation \
              CardShowScannerUITests/InventoryLabelsUITests/testSingleCardDraftIsIsolatedAndAcceptsZeroWithoutClampingCopies \
              CardShowScannerUITests/InventoryLabelsUITests/testInventoryPrintOrderSortsNumericPricesAndRemembersSelection \
              CardShowScannerUITests/InventoryLabelsUITests/testLeavingCustomAndBulkPrintQueuesClearsThemAndPreservesPreferences
          else
            bash scripts/run_ios_tests.sh CardShowScannerUITests
          fi
      - name: Publish UI test summary
        if: ${{ always() && steps.ui_tests.outcome != 'skipped' }}
        run: python3 scripts/report_xcode_test_summary.py NativeTests.log
      - name: Report UI test failures
        if: ${{ always() && steps.ui_tests.outcome != 'success' && steps.ui_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'UI tests failed; see the ui-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeCrashSummary.log
  research_ui:
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.job_scope == 'all' || inputs.job_scope == 'research_ui') && inputs.test_scope != 'printer_transport' && inputs.test_scope != 'label_preview' && inputs.test_scope != 'label_queue' && inputs.test_scope != 'show_readiness' && inputs.test_scope != 'label_controls' && inputs.test_scope != 'navigation_price') }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Research UI checks independently
        id: research_ui_tests
        run: bash scripts/run_ios_tests.sh CardShowScannerUITests/ResearchUITests CardShowScannerUITests/CardShowInventoryUITests
      - name: Publish Research UI summary
        if: ${{ always() && steps.research_ui_tests.outcome != 'skipped' }}
        run: python3 scripts/report_xcode_test_summary.py NativeTests.log
      - name: Report Research UI failures
        if: ${{ always() && steps.research_ui_tests.outcome != 'success' && steps.research_ui_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Research UI tests failed; see the research-ui-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ui-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeCrashSummary.log
  evidence_ui:
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.job_scope == 'all' || inputs.job_scope == 'evidence_ui') && inputs.test_scope != 'printer_transport' && inputs.test_scope != 'label_preview' && inputs.test_scope != 'label_queue' && inputs.test_scope != 'show_readiness' && inputs.test_scope != 'label_controls') }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and run navigation and chart UI checks independently
        id: evidence_ui_tests
        env:
          SCANNER_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: |
          case "$SCANNER_TEST_SCOPE" in
            navigation_price)
              bash scripts/run_ios_tests.sh \
                CardShowScannerUITests/AppNavigationUITests/testEditableCardRetainsMainTabsAndUnsavedDraftThroughResearchAndConnection \
                CardShowScannerUITests/AppNavigationUITests/testEditableCardSavesOnlyWhenExplicitlySavedAfterSwitchingTabs
              ;;
            all)
              bash scripts/run_ios_tests.sh CardShowScannerUITests/MarketEvidenceUITests CardShowScannerUITests/AppNavigationUITests CardShowScannerUITests/ReviewPresentationUITests CardShowScannerUITests/ListBulkDeletionUITests
              ;;
            *) echo "Unknown evidence UI test scope" >&2; exit 2 ;;
          esac
      - name: Publish evidence UI summary
        if: ${{ always() && steps.evidence_ui_tests.outcome != 'skipped' }}
        run: python3 scripts/report_xcode_test_summary.py NativeTests.log
      - name: Report evidence UI failures
        if: ${{ always() && steps.evidence_ui_tests.outcome != 'success' && steps.evidence_ui_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Evidence UI tests failed; see the evidence-ui-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-ui-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeCrashSummary.log
  budget_ui:
    if: ${{ github.event_name != 'workflow_dispatch' || ((inputs.job_scope == 'all' || inputs.job_scope == 'budget_ui') && inputs.test_scope != 'printer_transport' && inputs.test_scope != 'label_preview' && inputs.test_scope != 'label_queue' && inputs.test_scope != 'show_readiness' && inputs.test_scope != 'label_controls' && inputs.test_scope != 'navigation_price') }}
    runs-on: macos-15-intel
    # Eighteen bounded six-minute cases plus cold simulator/build setup.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build and run show budget UI check independently
        id: budget_ui_tests
        run: bash scripts/run_ios_tests.sh CardShowScannerUITests/ShowBudgetUITests CardShowScannerUITests/ShowTransactionsUITests
      - name: Publish show budget UI summary
        if: ${{ always() && steps.budget_ui_tests.outcome != 'skipped' }}
        run: python3 scripts/report_xcode_test_summary.py NativeTests.log
      - name: Report show budget UI failures
        if: ${{ always() && steps.budget_ui_tests.outcome != 'success' && steps.budget_ui_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Show budget UI check failed; see the budget-ui-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-ui-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeCrashSummary.log
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job_scope == 'all' || inputs.job_scope == 'release' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Release configuration for iPhone
        id: native_release
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project CardShowScanner.xcodeproj -scheme 'CardShowScanner Personal' -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee NativeRelease.log
      - name: Report Release build failures
        if: failure() && steps.native_release.outcome == 'failure'
        run: python3 scripts/annotate_xcode_errors.py NativeRelease.log --fallback 'Release compilation failed; see the native-release-results artifact.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release-results
          path: NativeRelease.log
