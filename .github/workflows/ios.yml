name: iOS workflow checks
on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules --test Tests/JavaScript/*.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_xcode_sources.py
      - run: python3 scripts/check_scanner_runtime.py
      - name: Build and run native regression tests
        id: native_tests
        shell: bash
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project CardShowScanner.xcodeproj -scheme CardShowScanner -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult 2>&1 | tee NativeTests.log
      - name: Report native test failures
        if: failure() && steps.native_tests.outcome == 'failure'
        run: python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Native tests failed; see the native-test-results artifact.'
      - name: Build Release configuration for iPhone
        id: native_release
        if: ${{ !cancelled() && steps.native_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project CardShowScanner.xcodeproj -scheme CardShowScanner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee NativeRelease.log
      - name: Report Release build failures
        if: failure() && steps.native_release.outcome == 'failure'
        run: python3 scripts/annotate_xcode_errors.py NativeRelease.log --fallback 'Release compilation failed; see the native-test-results artifact.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeRelease.log
