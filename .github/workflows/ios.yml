name: iOS workflow checks
on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules --test Tests/JavaScript/*.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_xcode_sources.py
      - run: python3 scripts/check_scanner_runtime.py
      - name: Build and run native regression tests
        id: native_tests
        shell: bash
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          # Xcode 16.3/16.4's iOS 18.4/18.5 simulator omits a Swift WebKit symlink.
          # Forward Apple's runtime-only workaround to XCTest; keep the app's iOS minimum.
          SCANNER_SWIFT_OVERLAY_DIR=$(python3 -c '
          import json, subprocess, sys
          from pathlib import Path
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          runtime_id = next(key for key, values in devices.items() if any(device["udid"] == sys.argv[1] for device in values))
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          runtime = next(value for value in runtimes if value["identifier"] == runtime_id)
          root = Path(runtime["runtimeRoot"]) if runtime.get("runtimeRoot") else Path(runtime["bundlePath"]) / "Contents/Resources/RuntimeRoot"
          overlay = root / "System/Cryptexes/OS/usr/lib/swift"
          if runtime.get("version", "").startswith(("18.4", "18.5")) and (overlay / "libswiftWebKit.dylib").is_file():
              print(overlay)
          ' "$DEVICE_ID")
          if [ -n "$SCANNER_SWIFT_OVERLAY_DIR" ]; then
            export TEST_RUNNER_DYLD_FALLBACK_LIBRARY_PATH="$SCANNER_SWIFT_OVERLAY_DIR:${TEST_RUNNER_DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}"
            echo "Using the simulator WebKit Swift-library compatibility path."
          fi
          xcodebuild test -project CardShowScanner.xcodeproj -scheme CardShowScanner -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult 2>&1 | tee NativeTests.log
      - name: Report native test failures
        if: failure() && steps.native_tests.outcome == 'failure'
        shell: bash
        run: |
          python3 scripts/annotate_xcode_errors.py NativeTests.log --fallback 'Native tests failed; see the native-test-results artifact.'
          xcrun xcresulttool export diagnostics --path TestResults.xcresult --output-path NativeDiagnostics || true
          python3 scripts/report_simulator_crash.py NativeDiagnostics "$HOME/Library/Logs/DiagnosticReports" | tee NativeCrashSummary.log
      - name: Build Release configuration for iPhone
        id: native_release
        if: ${{ !cancelled() && steps.native_tests.outcome != 'skipped' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project CardShowScanner.xcodeproj -scheme CardShowScanner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee NativeRelease.log
      - name: Report Release build failures
        if: failure() && steps.native_release.outcome == 'failure'
        run: python3 scripts/annotate_xcode_errors.py NativeRelease.log --fallback 'Release compilation failed; see the native-test-results artifact.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            TestResults.xcresult
            NativeTests.log
            NativeRelease.log
            NativeCrashSummary.log
