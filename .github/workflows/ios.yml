name: iOS workflow checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules --test Tests/JavaScript/*.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_xcode_sources.py
      - run: python3 scripts/check_scanner_runtime.py
      - name: Build and run native regression tests
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project CardShowScanner.xcodeproj -scheme CardShowScanner -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: TestResults.xcresult
